name: Garmin CN Sync To Global

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * 0' # weekly, Sunday 01:00 UTC (09:00 CST)
  push:
    branches:
      - master
    paths:
      - run_page/garmin_only_sync_cn_global.py
      - .github/workflows/garmin_cn_sync_to_global.yml
env:
  USE_CLOUDFLARE_WARP: true
  SAVE_DATA_IN_GITHUB_CACHE: true
  DATA_CACHE_PREFIX: 'track_data'

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Cloudflare WARP
        if: env.USE_CLOUDFLARE_WARP == 'true'
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --dearmor -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update && sudo apt-get install -y cloudflare-warp

      - name: Connect Cloudflare WARP
        if: env.USE_CLOUDFLARE_WARP == 'true'
        run: |
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode warp
          warp-cli --accept-tos connect
          sleep 3
          echo "WARP status:"
          warp-cli --accept-tos status
          echo "IP info:"
          curl -s https://cloudflare.com/cdn-cgi/trace | grep -E "ip|warp"

      - name: Cache Data Files
        if: env.SAVE_DATA_IN_GITHUB_CACHE == 'true'
        uses: actions/cache@v4
        with:
          path: |
            activities
            assets
            GPX_OUT
            TCX_OUT
            FIT_OUT
            Workouts
            run_page/data.db
            src/static/activities.json
            imported.json
          key: ${{ env.DATA_CACHE_PREFIX }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.DATA_CACHE_PREFIX }}-${{ github.sha }}-
            ${{ env.DATA_CACHE_PREFIX }}-

      # 运行「仅同步佳明国区数据到国际区」脚本
      - name: Run sync Garmin CN to Garmin script only
        run: |
          python run_page/garmin_only_sync_cn_global.py ${{ secrets.GARMIN_SECRET_STRING_CN }} ${{ secrets.GARMIN_SECRET_STRING }} --only-run

      - name: Disconnect Cloudflare WARP
        if: env.USE_CLOUDFLARE_WARP == 'true'
        run: |
          warp-cli --accept-tos disconnect

      - name: Push new runs
        if: env.SAVE_DATA_IN_GITHUB_CACHE != 'true'
        run: |
          git config --local user.email 'action@github.com'
          git config --local user.name 'GitHub Action'
          git add .
          git commit -m 'sync garmin cn to global' || echo 'nothing to commit'
          git push || echo 'nothing to push'
