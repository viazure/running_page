# Running Page 3.0 配置文件
# 修改此文件即可完成个性化设置，无需改动源代码。

# ── 地图 ──────────────────────────────────────────────────────────────────────

# Mapbox public access token（https://account.mapbox.com）
# Migrated from src/themes/classic/utils/const.ts
# For security, this token is managed via GitHub Actions secret (MAPBOX_TOKEN)
# Users should replace with their own token in GitHub Actions secrets
# See https://docs.github.com/en/actions/security-for-github-actions/security-guides/using-secrets-in-github-actions
mapbox_token: ''

# ── 外观 ─────────────────────────────────────────────────────────────────────

# 站点 URL
site_url: 'https://run.viazure.cc'

# 头像 URL（可选；支持本地路径或远程链接；留空或不写则不展示头像）
avatar: 'https://avatars-githubusercontent-webp.webp.se/u/9543636'

# 默认语言：zh（中文）| en（英文）
locale: zh

# 默认主题：system（跟随系统）| light（浅色）| dark（深色）
theme: system

# ── 主题预设 ──────────────────────────────────────────────────────────────────
# 可选值：dashboard | dashboard_pro | classic | 自定义主题名
# 自定义主题：在 src/themes/<name>/ 下创建主题，并在 src/App.tsx 注册后填写对应名称
theme_preset: dashboard_pro

# 隐私模式：true 时默认关灯底图、匿名活动名
# false 时始终显示完整地图与真实活动名（dashboard_pro / classic 共用）
privacy_mode: true

# 是否允许临时解除隐私模式（关闭后隐私始终锁定，无法被触发解除）
privacy_unlock: true

# 隐私锁定时是否用时段匿名标题（清晨跑步等）；解锁后显示原活动名
# false：始终显示原活动名（仅地图关灯受隐私影响）
privacy_anonymous_titles: true

# ── dashboard_pro 主题选项 ────────────────────────────────────────────────────
# 仅 theme_preset: dashboard_pro 时生效；默认外观与现在一致（模块全开、Latest 关）
dashboard_pro:
  # 首页 Latest 紧凑条（活动列表顶 1～3 条）；默认关
  show_latest: false
  # 首页模块开关（false 不渲染）
  modules:
    weekly: true # 本周目标
    yearly_goal: true # 年目标
    monthly_goal: true # 月目标
    streak: true # 连续
    heatmap: true # 贡献热力
    footprint: true # 足迹（中国地图）
    month_glance: true # 本月快览（右下角槽）

# 博客 URL（可选；配置后顶栏最右侧显示强调入口，未配置则不显示）
blog_url: 'https://viazure.cc'

# 顶栏其它外链（可选；显示在页面导航旁）
nav_links: []

# 页脚 GitHub 仓库链接（可选；配置后 copyright 旁显示）
github_url: 'https://github.com/viazure/running_page'

# ── 运动目标 ──────────────────────────────────────────────────────────────────
# unit: distance → 单位 km

goals:
  all:
    yearly: 400
    monthly: 40
    weekly: 15
    unit: distance

  Run:
    yearly: 400
    monthly: 40
    weekly: 15
    unit: distance

# ── 分段分析（公开默认；个人 LTHR/最大心率/FTP 用 VITE_LTHR / VITE_MAX_HR / VITE_FTP）──
# prefer: device（默认）有设备心率区间就用设备的；没有时（如小米 TCX）才按站点乳酸阈表重分。
# prefer: auto 在设备边界与站点表不一致时也会重分设备区间。prefer: lthr 强制按心率曲线重分。
# lthr_percents 是从 <Z1 起各档高限，不是「Z1..Z5 上限」的含糊说法：
# <Z1≤65%，Z1 65–80%，Z2 80–89%，Z3 89–95%，Z4 95–100%，Z5 100–107%，之上为 >Z5。
# 有 VITE_MAX_HR 时 Z5 高限用最大心率 bpm，避免百分比取整偏差。
# 不要把个人乳酸阈/最大心率/FTP 写进仓库。
analysis:
  hr_zones:
    method: percent_lthr
    prefer: device
    lthr_percents: [65, 80, 89, 95, 100, 107]
    # 无 LTHR 时退回 %MaxHR（按当次最高心率，不是生理最大心率）
    maxhr_percents: [50, 60, 70, 80, 90, 100]
