<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        const basePath = '%BASE_URL%';
        const redirect = sessionStorage.getItem('redirect');
        if (redirect) {
          sessionStorage.removeItem('redirect');
          if (
            redirect !== basePath + '/' &&
            redirect !== basePath + '/index.html'
          ) {
            window.history.pushState(null, '', redirect);
          }
        }

        // Apply theme before first paint (mirrors src/core/theme.tsx).
        try {
          var theme = localStorage.getItem('theme') || 'dark';
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(theme);
          root.setAttribute('data-theme', theme);
          root.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <style>
      /* Boot-only tokens (do NOT set --color-* — those collide with classic).
         Pro shell CSS is injected by Vite only when theme_preset === dashboard_pro.
         @layer boot stays below theme @layer base so classic/dashboard can win. */
      @layer boot {
        :root,
        html.dark,
        html[data-theme='dark'] {
          --boot-bg: #0b0d10;
          --boot-card: #14171c;
          --boot-border: #23272e;
          --boot-text: #e6edf3;
          --boot-muted: #8b949e;
          --boot-run: #f97316;
        }
        html.light,
        html[data-theme='light'] {
          --boot-bg: #f7f6f3;
          --boot-card: #ffffff;
          --boot-border: #e8e4de;
          --boot-text: #1a1a1a;
          --boot-muted: #6b6560;
          --boot-run: #f97316;
        }
        html,
        body {
          margin: 0;
          min-height: 100%;
          background: var(--boot-bg);
          font-family:
            -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
      }
    </style>
    <!--boot-shell-pro-style-->
    <link rel="icon" type="image/png" href="%BASE_URL%/images/favicon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Running Page</title>
  </head>
  <body>
    <div id="root"><!--boot-shell-pro--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
